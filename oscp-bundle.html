<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        const path = window.location.pathname
          .replace(/\/$/, "")        // remove trailing slash
          .replace(".html", "");     // remove .html

        const slug = path.split("/").pop();

        if (slug) {
          window.location.replace(
            "https://zishanhack.com/products/" + slug
          );
        } else {
          window.location.replace("https://zishanhack.com/products");
        }
      })();
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
